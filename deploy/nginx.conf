# /etc/nginx/sites-available/dispatch  (Ubuntu)  or  /etc/nginx/conf.d/dispatch.conf  (Amazon Linux)
# After DNS points here, run:  sudo certbot --nginx -d dispatch.yourdomain.com
server {
    listen 80;
    server_name dispatch.yourdomain.com;

    # Article PDFs are uploaded through the app (nginx default is only 1 MB)
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
